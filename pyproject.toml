[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-platform"
version = "0.1.0"
description = "Scientific molecular research platform"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
molecular = "molecular.cli:app"

[tool.setuptools.packages.find]
where = ["src"]